<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#283335" />
    <title>余光</title>
    <style>
      :root {
        --ink: #e8e7de;
        --muted: #adb9b4;
        --glass: #202c2de8;
        --line: #b9ccc333;
        --orange: #eba267;
        --green: #a0ceb3;
        --red: #de7165;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #283335;
        color: var(--ink);
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 5px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      canvas#world {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 12px 20px;
      }
      button:hover {
        background: #ffffff12;
      }
      button.primary {
        background: var(--orange);
        color: #253032;
        border: 0;
        font-weight: 700;
        min-width: 220px;
        display: flex;
        justify-content: space-between;
        gap: 36px;
      }
      button.primary:hover {
        background: #f8bb8b;
      }
      [hidden] {
        display: none !important;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
        letter-spacing: 2px;
      }
      .muted {
        color: var(--muted);
      }
      .orange {
        color: var(--orange);
      }
      .screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        padding: 36px 5.2vw;
        background: linear-gradient(
          90deg,
          #202e32ed 0%,
          #202e32ba 43%,
          #202e3210 100%
        );
        display: flex;
        flex-direction: column;
      }
      .intro {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
      }
      .intro-copy {
        max-width: 580px;
      }
      #start { margin-top: 40px; }
      h1 {
        font-size: clamp(74px, 10vw, 154px);
        line-height: 0.95;
        margin: 0;
        letter-spacing: -8px;
        font-weight: 850;
      }
      .footer {
        display: flex;
        gap: 24px;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--line);
        padding-top: 17px;
        font-size: 11px;
        color: var(--muted);
      }
      .settings {
        display: flex;
        gap: 17px;
        align-items: center;
        flex-wrap: wrap;
      }
      .settings label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        background: #2a383b;
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 3px 8px;
      }
      input[type="range"] {
        width: 80px;
        accent-color: var(--orange);
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        display: none;
        text-shadow: 0 1px 5px #182223;
      }
      .hud-top {
        position: absolute;
        top: 26px;
        left: 30px;
        right: 30px;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
      }
      .wave-box {
        min-width: 205px;
        text-align: right;
      }
      .wave-box b {
        font:
          36px/1.1 Impact,
          sans-serif;
      }
      .wave-box .label {
        letter-spacing: 3px;
        font-size: 10px;
        margin-right: 8px;
      }
      .wave-sub {
        font-size: 12px;
        color: #d3dfd8;
        margin-top: 6px;
      }
      .top-stats {
        margin-top: 12px;
        color: #c2ccc8;
        font: 11px monospace;
        letter-spacing: 1px;
      }
      .bottom-left {
        position: absolute;
        left: 30px;
        bottom: 27px;
        display: flex;
        flex-direction: column;
        gap: 17px;
      }
      .partner {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .avatar {
        background: #384d50bd;
        border: 1px solid #a0ceb367;
        width: 34px;
        height: 38px;
        display: grid;
        place-items: center;
        color: var(--green);
        font-weight: 700;
      }
      .partner small {
        display: block;
        font-size: 10px;
        color: #b8cec2;
      }
      .health-line {
        display: flex;
        align-items: baseline;
        gap: 13px;
      }
      .health-line b {
        font:
          42px/1 Impact,
          sans-serif;
      }
      .health-line .cross {
        font-size: 27px;
        color: var(--green);
      }
      .health-line small {
        font: 11px monospace;
        color: #b2c2ba;
      }
      .bar {
        height: 4px;
        width: 210px;
        background: #172527b0;
        margin-top: 8px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--green);
        transition: width 0.1s;
      }
      .bar.stamina {
        height: 2px;
        margin-top: 6px;
        opacity: 0.7;
      }
      .bar.stamina i {
        background: var(--ink);
      }
      .bottom-right {
        position: absolute;
        right: 30px;
        bottom: 26px;
        text-align: right;
      }
      .ammo {
        font:
          58px/1.2 Impact,
          sans-serif;
      }
      .ammo span {
        font: 22px monospace;
        color: #c1cec8;
        margin-left: 10px;
      }
      .ammo em {
        font: 15px monospace;
        color: #93a9a2;
        margin: 0 9px;
      }
      .action-hint {
        font-size: 10px;
        letter-spacing: 1px;
        color: #bdccc4;
      }
      .center-dot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%);
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--gap, 28px);
        height: var(--gap, 28px);
        transform: translate(-50%, -50%);
        transition:
          width 0.09s,
          height 0.09s;
      }
      #crosshair:before,
      #crosshair:after {
        content: "";
        position: absolute;
        background: #edf1e9;
        box-shadow: 0 0 2px #000;
      }
      #crosshair:before {
        width: 1px;
        height: 6px;
        left: 50%;
        top: 0;
        box-shadow: 0 calc(var(--gap, 28px) - 6px) #edf1e9;
      }
      #crosshair:after {
        width: 6px;
        height: 1px;
        top: 50%;
        left: 0;
        box-shadow: calc(var(--gap, 28px) - 6px) 0 #edf1e9;
      }
      #hitmarker {
        position: absolute;
        left: 50%; top: 50%; width: 28px; height: 28px;
        transform: translate(-50%, -50%); opacity: 0;
        color: #fff1d7; filter: drop-shadow(0 1px 2px #000);
      }
      #hitmarker i {
        position: absolute; left: 13px; top: 10px; width: 2px; height: 8px;
        background: currentColor; transform: rotate(45deg) translateY(-11px);
      }
      #hitmarker i:nth-child(2) { transform: rotate(135deg) translateY(-11px); }
      #hitmarker i:nth-child(3) { transform: rotate(225deg) translateY(-11px); }
      #hitmarker i:nth-child(4) { transform: rotate(315deg) translateY(-11px); }
      #hitmarker[data-kind="head"] { color: #ffd078; }
      #hitmarker[data-kind="kill"] { color: #ff8068; }
      #hitmarker[data-kind="kill"] i { width: 3px; height: 10px; }
      #damage-numbers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .damage-number {
        position: absolute; font: 700 22px/1 "SFMono-Regular", Consolas, monospace;
        color: #fff1d7; text-shadow: 0 2px 3px #000, 0 0 8px #15120c;
        will-change: transform, opacity; white-space: nowrap;
      }
      .damage-number.headshot { color: #ffd078; font-size: 27px; }
      .damage-number.lethal { color: #ff9879; }
      #kill-confirm {
        position: absolute; top: calc(50% + 43px); left: 50%; transform: translateX(-50%);
        font-size: 12px; font-weight: 600; letter-spacing: 2px; color: #ffc199;
        text-shadow: 0 2px 4px #000; opacity: 0; white-space: nowrap;
      }
      #damage {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        box-shadow: inset 0 0 180px 50px #b82b28;
        opacity: 0;
      }
      #toast {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 2px;
        transition: opacity 0.2s;
        white-space: pre-line;
        opacity: 0;
      }
      #interact {
        position: absolute;
        bottom: 24%;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 16px;
        background: #263734db;
        border: 1px solid var(--line);
        font-size: 12px;
        white-space: nowrap;
      }
      kbd {
        display: inline-grid;
        place-items: center;
        min-width: 23px;
        height: 23px;
        border: 1px solid #b7c8c14d;
        background: #e5ead00a;
        border-radius: 3px;
        font: 11px monospace;
        color: #f0eee1;
        margin-right: 8px;
        padding: 0 5px;
      }
      #objective {
        position: absolute;
        top: 26px;
        left: 30px;
        font-size: 12px;
        color: #dce5dc;
        width: 300px;
        max-width: calc(100vw - 175px);
        padding: 12px 15px;
        border-left: 2px solid var(--orange);
        background: linear-gradient(90deg, #10201ff0, #10201f80);
      }
      #objective-step {display:block;font-size:10px;letter-spacing:1.5px;color:var(--orange);margin-bottom:6px;}
      .objective-heading {display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
      #objective-title {font-size:20px;font-weight:650;}
      #objective-distance {font:12px monospace;color:#f0c597;white-space:nowrap;}
      #objective-detail {font-size:12px;line-height:1.65;color:#c0d2c9;margin:7px 0 11px;}
      #objective-progress {display:flex;gap:12px;font-size:10px;color:#84958e;}
      #objective-progress span:before {content:'○';margin-right:4px;}
      #objective-progress [data-state="done"] {color:#9bcdad;}
      #objective-progress [data-state="done"]:before {content:'✓';}
      #objective-progress [data-state="current"] {color:#f0c597;}
      #objective-progress [data-state="current"]:before {content:'◆';}
      #objective[data-urgent="true"] {border-color:#ef937a;}
      #minimap {
        position: absolute;
        right: 30px;
        top: 136px;
        width: 145px;
        height: 180px;
        border: 1px solid var(--line);
        background: #1e2d2bba;
      }
      #reload {
        position: absolute;
        top: 58%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--orange);
      }
      #help {
        position: fixed;
        z-index: 30;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(480px, 90vw);
        padding: 28px 32px;
        background: #243438f5;
        border: 1px solid #d9e4d945;
        box-shadow: 0 25px 70px #101c2255;
      }
      #help h2 {
        font-size: 22px;
        margin: 0 0 24px;
        letter-spacing: 3px;
      }
      #help-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        color: var(--muted);
        font-size: 28px;
        line-height: 1;
      }
      #help-close:hover { color: var(--ink); }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 13px 20px;
        font-size: 12px;
      }
      .modal-screen {
        background: #1c2b2fbc;
        backdrop-filter: blur(9px);
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .modal-screen h2 {
        font-size: clamp(35px, 6vw, 72px);
        letter-spacing: 8px;
        margin: 15px 0;
      }
      .modal-screen p {
        color: var(--muted);
        max-width: 420px;
        font-size: 13px;
      }
      .modal-screen .primary {
        margin: 22px auto 0;
      }
      .results {
        display: flex;
        gap: 44px;
        margin: 25px 0;
      }
      .results strong {
        font:
          44px Impact,
          sans-serif;
        display: block;
      }
      .results small {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 2px;
      }
      #load-error {
        color: #ffb6a0;
        max-width: 470px;
        font-size: 12px;
        margin-top: 15px;
      }
      #fatal {
        z-index: 100;
        background: #223236;
      }
      #pause .settings {
        justify-content: center;
        margin-top: 16px;
      }
      #mobile-note {
        display: none;
      }
      .intro {
        min-height: 0;
      }
      @media (max-width: 800px) {
        .screen {
          padding: 22px 6vw;
        }
        h1 {
          font-size: 100px;
        }
        .intro {
          align-items: center;
        }
        .footer {
          align-items: flex-start;
          gap: 12px;
          flex-direction: column;
        }
        .hud-top {
          top: 18px;
          left: 18px;
          right: 18px;
        }
        .bottom-left {
          left: 18px;
          bottom: 18px;
        }
        .bottom-right {
          right: 18px;
          bottom: 18px;
        }
        #objective {
          left: 18px;
          top: 22px;
          max-width: 230px;
        }
        #minimap {
          right: 18px;
          top: 120px;
          width: 100px;
          height: 125px;
        }
        .bar {
          width: 155px;
        }
      }
      @media (pointer: coarse) {
        #mobile-note {
          display: block;
          color: var(--orange);
          font-size: 12px;
        }
      }
      @media (max-height: 620px) {
        .screen {
          padding-top: 16px;
          padding-bottom: 16px;
        }
        h1 {
          font-size: 76px;
        }
        .intro {
          padding: 18px 0;
        }
        .footer {
          padding-top: 9px;
        }
        .controls {
          gap: 8px;
        }
        #help {
          padding: 20px 26px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
      #flashlight-tip {position:absolute;bottom:32%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid #c6b58e66;background:#101c23ec;color:#ecdfbb;box-shadow:0 8px 35px #0005;pointer-events:none;}
      #flashlight-tip[hidden],#waypoint[hidden] {display:none;}
      #flashlight-tip kbd {border:1px solid #ccb888;margin-right:0;}
      #waypoint {position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;color:#fae3c4;text-shadow:0 2px 6px #000;background:#102224ed;border-bottom:2px solid #edb47f;padding:9px 12px;font-size:13px;pointer-events:none;white-space:nowrap;}
      #waypoint-icon {font:25px/1 sans-serif;color:#f1bd80;}
      #waypoint-label {display:block;font-weight:600;}
      #waypoint-distance {display:block;font:11px/1.6 monospace;color:#c1d2c9;margin-top:2px;}
      #companion-dialogue {position:absolute;bottom:21%;left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:12px;width:max-content;max-width:min(660px,calc(100vw - 48px));padding:12px 18px;background:#101c20eb;border-left:2px solid #9ac6b4;font-size:15px;line-height:1.65;text-align:left;}
      #companion-dialogue b {color:#a9d3bd;font-size:12px;white-space:nowrap;}
      #companion-line {color:#f1eee3;}
      #interact {font-size:14px;border-color:#dab186;}
      #player-prompts {position:absolute;bottom:21%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;width:min(660px,calc(100vw - 48px));}
      #player-prompts > div {position:static;transform:none;max-width:100%;}
      @media(max-width:700px) {#objective {padding:9px 11px;}#objective-title {font-size:16px;}#objective-detail {font-size:11px;}#objective-progress {gap:8px;}#companion-dialogue {font-size:13px;bottom:24%;}#waypoint {font-size:12px;padding:7px 9px;}}
      #tutorial-task {margin-top:12px;padding-top:10px;border-top:1px solid #9ac6b440;max-width:360px;}
      #tutorial-label {display:block;color:#efc694;font-size:12px;letter-spacing:.03em;}
      #tutorial-detail {margin:5px 0;color:#e4e8df;font-size:12px;line-height:1.5;}
      #tutorial-reward {font-size:11px;color:#abcabb;}
      #tutorial-task[data-complete="true"] #tutorial-label {color:#abcabb;}
      #equipment {display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;justify-content:flex-end;max-width:380px;font-size:12px;color:#dce4d8;}
      #equipment span {white-space:nowrap;} #equipment kbd {margin-right:4px;}
      #equipment b {font:11px monospace;color:#e9c799;}
      #equipment [data-empty="true"] {opacity:.45;}
      #reward-notice {padding:12px 20px;background:#15241fee;border:1px solid #b4c6a97a;color:#f1e5c8;font-size:14px;text-align:center;}
      #smoke-screen {position:fixed;inset:0;pointer-events:none;background:#606b67;opacity:0;transition:opacity .2s;}
      #tutorial-task[hidden],#equipment[hidden],#reward-notice[hidden] {display:none;}
      @media(max-width:700px) {#equipment {max-width:220px;gap:6px;font-size:11px;}#tutorial-task {max-width:275px;}}
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="余光，第一人称生存游戏"></canvas>
    <div id="menu" class="screen">
      <main class="intro">
        <div class="intro-copy">
          <h1>余光</h1>
          <button id="start" class="primary" disabled>
            <span>加载中…</span><span>→</span>
          </button>
          <div id="load-error" role="alert"></div>
          <div id="mobile-note">需鼠标和键盘</div>
          <a href="credits.html" target="_blank" rel="noopener" style="display:inline-block;margin-top:16px;color:#a4aca9;font-size:11px;letter-spacing:.06em">致谢 ↗</a>
        </div>
      </main>
      <footer class="footer">
        <div class="settings">
          <label
            >画质
            <select id="quality">
              <option value="low">流畅</option>
              <option value="high" selected>标准</option>
            </select></label
          ><label
            >灵敏度
            <input
              id="sensitivity"
              aria-label="鼠标灵敏度"
              type="range"
              min="0.5"
              max="2"
              step="0.1"
              value="1" /></label
          ><label><input id="sound" type="checkbox" checked /> 声音</label>
        </div>
      </footer>
    </div>
    <div id="smoke-screen" aria-hidden="true"></div>
    <div id="hud">
      <div class="hud-top">
        <div class="wave-box">
          <span class="label">波次</span><b id="wave">00</b>
          <div id="wave-sub" class="wave-sub"></div>
          <div class="top-stats">
            击杀 <span id="kills">0</span>
          </div>
        </div>
      </div>
      <div id="objective">
        <span id="objective-step">准备出发</span>
        <div class="objective-heading"><strong id="objective-title" role="status">离开安全屋</strong><span id="objective-distance"></span></div>
        <p id="objective-detail">向前靠近出口，出门后左转</p>
        <div id="objective-progress" aria-label="补给路线"><span>诊所</span><span>弹药平台</span><span>泵站</span></div>
        <div id="tutorial-task" hidden><strong id="tutorial-label"></strong><p id="tutorial-detail"></p><span id="tutorial-reward"></span></div>
      </div>
      <canvas
        id="minimap"
        width="174"
        height="216"
        aria-label="街区战术地图"
      ></canvas>
      <div class="center-dot"></div>
      <div id="crosshair"></div>
      <div id="damage-numbers" aria-hidden="true"></div>
      <div id="hitmarker" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="kill-confirm" aria-hidden="true"></div>
      <div id="toast"></div>
      <div id="reload" hidden>换弹</div>
      <div id="waypoint" hidden aria-hidden="true"><span id="waypoint-icon">◇</span><div><b id="waypoint-label"></b><small id="waypoint-distance"></small></div></div>
      <div id="player-prompts">
        <div id="reward-notice" hidden role="status"></div>
        <div id="flashlight-tip" hidden><kbd>F</kbd>手电</div>
        <div id="interact" hidden></div>
        <div id="companion-dialogue" hidden role="status"><b>林</b><span id="companion-line"></span></div>
      </div>
      <div class="bottom-left">
        <div class="partner">
          <div class="avatar">林</div>
          <div>
            <small id="ally-status">100</small>
          </div>
        </div>
        <div>
          <div class="health-line">
            <span class="cross">+</span><b id="health">100</b
            ><small>/ 100</small>
          </div>
          <div class="bar"><i id="health-bar" style="width: 100%"></i></div>
          <div class="bar stamina">

          ui["ammo-hint"].textContent = player.reload > 0 ? "" :
            player.ammo < 10 && player.reserve > 0 ? "R 换弹" :
            player.ammo === 0 ? "寻找弹药" : "";
          const allyStatus = guide.returning ? "接应" : guide.complete ? "掩护" :
            guide.status.startsWith("带路") ? "带路" : "等待";
          ui["ally-status"].textContent = ally.hp <= 0 ? "倒地" :
            Math.ceil(ally.hp) + " · " + allyStatus;
          ui.toast.style.opacity =
            state.toast > 0 ? Math.min(1, state.toast * 2) : 0;
          ui.damage.style.opacity =
            Math.min(0.7, state.hurt) +
            (player.hp < 25 && state.mode === "playing" ? 0.12 : 0);
          $("flashlight-tip").hidden = flashlight.visible || state.help || state.mode !== "playing";
          guidance.update();
          tutorial.render();
          equipment.render();
          findInteraction();
          drawMap();
        }
        function reset() {
          combat.reset();
          tactics.reset();
          guidance.reset();
          equipment.reset();
          tutorial.reset();
          bloodPools.forEach(p=>{p.life=0;p.mesh.visible=false;});
          for (const e of [...enemies, ...corpses]) {
            e.g.visible = false;
            enemyPool.push(e);
          }
          enemies.length = 0;
          corpses.length = 0;
          for(const e of enemyPool)e.bodyMat.emissive.setHex(0);
          ally.resetPose();
          effects.length = 0;
          particleMesh.count = 0;
          Object.assign(state, {
            mode: "playing",
            help: true,
            time: 0,
            wave: 0,
            completed: 0,
            pending: 0,
            spawned: 0,
            spawnClock: 0,
            between: -1,
            gate: false,
            gateY: 0,
            score: 0,
            kills: 0,
            toast: 0,
            hurt: 0,
            training: 0,
            navTimer: 0,
          });
          Object.assign(player, {
            x: 0,
            z: 36,
            y: 0,
            vy: 0,
            yaw: 0,
            pitch: 0,
            hp: 100,
            ammo: 30,
            reserve: 180,
            stamina: 100,
            reload: 0,
            fire: 0,
            grounded: true,
            moving: false,
            sprinting: false,
          });
          Object.assign(ally, {
            x: 3,
            z: 35,
            y: 0,
            hp: 100,
            cool: 0,
            heal: 0,
            down: 0,
            kills: 0,
          });
          ally.g.position.set(3, 0, 35);
          ally.g.rotation.set(0, 0, 0);
          ally.target=null;ally.shot=0;ally.aim=0;ally.animate(0,false);allyTracer.visible=false;
          guide.reset();state.flashlightUsed=false;
          gateGroup.position.y = 0;
          gateGroup.updateMatrixWorld(true);
          gateCollider.active = true;
          barriers.forEach((b) => {
            b.hp = 110;
            b.c.active = true;
            b.group.visible = true;
          });
          supplies.forEach((s) => { s.ready = 0; s.halo.visible = true; s.halo.scale.setScalar(1); });
          targets.forEach((t) => {
            if (t.userData.target) {
              t.material.color.set("#bfab78");
              t.userData.reset = 0;
            }
          });
          keys.clear();
          mouseDown = false;
          aiming = false;
          flashlight.visible = false;
          camera.fov = 76;
          buildNav();
          buildField();
          ui.menu.hidden = true;
          ui.gameover.hidden = true;
          ui.pause.hidden = true;
          ui.help.hidden = false;
          ui.hud.style.display = "block";
          updateUI();
          updateCamera(0);
          setHelp(true);
        }
        function endGame() {
          combat.suspend();
          state.mode = "dead";
          keys.clear();
          mouseDown = false;
          ui.help.hidden = true;
          state.help = false;
          ui.pause.hidden = true;
          ui.gameover.hidden = false;
          $("result-wave").textContent = state.completed;
          $("result-kills").textContent = state.kills;
          $("result-score").textContent = state.score;
          $("result-time").textContent = "用时 " +
            String(Math.floor(state.time / 60)).padStart(2, "0") + ":" +
            String(Math.floor(state.time % 60)).padStart(2, "0");
          if (document.pointerLockElement) document.exitPointerLock();
        }
        async function lock() {
          try {
            const result = canvas.requestPointerLock();
            if (result && result.catch) await result;
          } catch (e) {
            pause(
              "请点击继续以启用鼠标。",
            );
          }
        }
        function pause(text = "") {
          if (state.mode !== "playing") return;
          state.mode = "paused";
          combat.suspend();
          keys.clear();
          mouseDown = false;
          aiming = false;
          ui.pause.hidden = false;
          $("pause-text").textContent = text;
          $("pause-text").hidden = !text;
        }
        function setHelp(open) {
          state.help = open;
          ui.help.hidden = !open;
          keys.clear();
          mouseDown = false;
          aiming = false;
          combat.suspend();
          if (open) {
            if (document.pointerLockElement) document.exitPointerLock();
            $("help-close").focus({preventScroll: true});
          } else {
            $("help-close").blur();
            if (state.mode === "playing") lock();
          }
        }
        $("help-close").onclick = () => setHelp(false);
        ui.start.disabled = false;
        ui.start.innerHTML = "<span>开始</span><span>→</span>";
        ui.start.onclick = () => {
          reset();
          sound("pickup");
        };
        $("restart").onclick = () => {
          reset();
          sound("pickup");
        };
        $("resume").onclick = () => {
          lock();
        };
        document.addEventListener("pointerlockchange", () => {
          locked = document.pointerLockElement === canvas;
          if (locked && state.help) {
            document.exitPointerLock();
            return;
          }
          if (locked && state.mode === "paused") {
            state.mode = "playing";
            ui.pause.hidden = true;
          } else if (!locked && state.mode === "playing" && !state.help) pause();
        });
        document.addEventListener("pointerlockerror", () =>
          pause("浏览器未锁定鼠标。点击继续再试一次。"),
        );
        document.addEventListener("visibilitychange", () => {
          if (document.hidden && state.mode === "playing") {
            pause();
            if (document.pointerLockElement) document.exitPointerLock();
          }
        });
        window.addEventListener("blur", () => {
          if (state.mode === "playing") {
            pause();
            if (document.pointerLockElement) document.exitPointerLock();
          }
        });
        document.addEventListener("keydown", (e) => {
          if (
            ["Space", "Tab", "ArrowUp", "ArrowDown"].includes(e.code) &&
            state.mode !== "menu"
          )
            e.preventDefault();
          if (
            e.code === "KeyH" &&
            !e.repeat &&
            (state.mode === "playing" || state.mode === "paused")
          ) {
            setHelp(!state.help);
            return;
          }
          if (state.mode !== "playing" || state.help || !locked) return;
          keys.add(e.code);
          if (e.repeat) return;
          if (e.code === "KeyR") reload();
          if (e.code === "KeyE") interact();
          if (e.code === "KeyF") toggleFlashlight();
          if (e.code === "KeyV") equipment.melee();
          if (e.code === "KeyQ") equipment.heal();
          if (e.code === "KeyG") equipment.throwItem('smoke');
          if (e.code === "KeyT") equipment.throwItem('grenade');
          if (e.code === "Space" && player.grounded) {
            player.vy = 7;
            player.grounded = false;
          }
        });
        document.addEventListener("keyup", (e) => keys.delete(e.code));
        document.addEventListener("mousemove", (e) => {
          if (!locked || state.mode !== "playing" || state.help) return;
          const sensitivity =
            0.002 * Number($("sensitivity").value) * (aiming ? 0.62 : 1);
          player.yaw -= e.movementX * sensitivity;
          player.pitch = clamp(
            player.pitch - e.movementY * sensitivity,
            -1.45,
            1.45,
          );
        });
        document.addEventListener("mousedown", (e) => {
          if (!locked || state.mode !== "playing" || state.help) return;
          if (e.button === 0) mouseDown = true;
          if (e.button === 2) aiming = true;
        });
        document.addEventListener("mouseup", (e) => {
          if (e.button === 0) mouseDown = false;
          if (e.button === 2) aiming = false;
        });
        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        $("quality").onchange = () => {
          const high = $("quality").value === "high";
          renderer.setPixelRatio(Math.min(devicePixelRatio, high ? 1.5 : 1));
          renderer.shadowMap.enabled = high;
          flashlight.castShadow = high;
          scene.traverse((o) => {
            if (o.isMesh && o.material) o.material.needsUpdate = true;
          });
        };
        window.addEventListener("resize", () => {
          renderer.setSize(innerWidth, innerHeight);
          camera.aspect = weaponCamera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          weaponCamera.updateProjectionMatrix();
        });
        canvas.addEventListener("webglcontextlost", (e) => {
          e.preventDefault();
          pause();
          $("fatal").hidden = false;
          $("fatal-text").textContent =
            "图形上下文丢失。请重新加载游戏，并尝试将画质设为“流畅”。";
        });
        function updateCamera(dt) {
          const moving = player.moving && player.grounded && !state.help && state.mode === "playing";
          const bob = moving ? Math.sin(state.time * (player.sprinting ? 15 : 10)) * .035 * (1 - combat.recoil.ads * .8) : 0;
          const kick = combat.view(state.time);
          camera.position.set(player.x + kick.x, player.y + 1.68 + bob + kick.y, player.z);
          camera.rotation.set(clamp(player.pitch + kick.pitch, -1.5, 1.5), player.yaw + kick.yaw, kick.roll, 'YXZ');
          const fov = T.MathUtils.lerp(player.sprinting ? 82 : 76, 56, combat.recoil.ads);
          camera.fov = T.MathUtils.damp(camera.fov, fov, 18, dt);
          camera.updateProjectionMatrix();
          weaponCamera.fov = T.MathUtils.lerp(58, 48, combat.recoil.ads);
          weaponCamera.updateProjectionMatrix();
          combat.pose({time: state.time, moving, sprinting: player.sprinting, reload: player.reload});
          combat.renderHUD();
          equipment?.pose();
        }
        function simulate(dt) {
          if(state.mode!=="playing"||state.help)return;
          state.time += dt;
          state.navTimer -= dt;
          if (state.navTimer <= 0) {
            buildField();
            state.navTimer = 0.5;
          }
          combat.tick(dt, aiming && player.reload <= 0);
          equipment.update(dt);
          updatePlayer(dt);
          updateWave(dt);
          updateEnemies(dt);
          if (state.mode !== "playing") return;
          updateAlly(dt);
          tutorial.update();
          updateEffects(dt);
          if (state.gate) {
            state.gateY = Math.min(4.2, state.gateY + dt * 3);
            gateGroup.position.y = state.gateY;
          }
          for (const s of supplies) {
            s.halo.visible = s.ready <= state.time;
            s.halo.scale.setScalar(1 + Math.sin(state.time * 3) * .06);
          }
          updateCamera(dt);
        }
        function frame(now) {
          requestAnimationFrame(frame);
          const dt = Math.min(0.035, (now - lastTime) / 1000 || 0.016);
          lastTime = now;
          if (state.mode === "menu") {
            camera.position.set(8, 8.6, 23);
            camera.lookAt(-3, 2, -24);
            camera.rotation.y += Math.sin(now * 0.00008) * 0.035;
          } else if (state.mode === "playing" && !state.help && locked)
            simulate(dt);
          uiClock += dt;
          if (uiClock > 0.08 && state.mode !== "menu") {
            updateUI();
            uiClock = 0;
          }
          district.update(state.mode === "menu" ? now / 1000 : state.time, camera);
          renderer.autoClear = true;
          renderer.render(scene, camera);
          if (state.mode !== "menu") {
            flashlightBounce.visible = flashlight.visible;
            renderer.autoClear = false;
            renderer.clearDepth();
            renderer.render(weaponScene, weaponCamera);
            renderer.autoClear = true;
          }
        }
        buildNav();
        requestAnimationFrame(frame);
        // Explicit opt-in test access; absent from ordinary play, including direct file opening.
        if (new URLSearchParams(location.search).has("test"))
          window.__game = {
            state,
            guide,
            guidance, tutorial, equipment, canSee,
            tactics, navigation, types, colliders, bloodPools, updateEnemies, updateEffects, visible, damageBarrier,
            scene,
            district,
            flashlight,
            toggleFlashlight,
            allyTracer,
            combat, gun, muzzle, ejector, bolt, flash, weaponCamera, weaponScene,
            player,
            ally,
            enemies,
            corpses,
            barriers,
            supplies,
            targets,
            keys,
            renderer,
            camera,
            reset,
            simulate,
            shoot,
            reload,
            interact,
            openGate,
            startWave,
            spawnEnemy,
            hurtEnemy,
            damagePlayer,
            floorAt,
            blocked,
            move,
            buildNav,
            buildField,
            field,
            cell,
            point,
            chooseSpawn,
            updateUI,
            updateCamera,
            setLocked: (v) => (locked = v),
            setAiming: v => { aiming = v; },
            setFiring: v => { mouseDown = v; },
            pause,
            snapshot: () => ({
              mode: state.mode,
              wave: state.wave,
              pending: state.pending,
              enemies: enemies.length,
              player: { ...player },
              gate: state.gate,
              score: state.score,
              kills: state.kills,
              drawCalls: renderer.info.render.calls,
              geometries: renderer.info.memory.geometries,
            }),
          };
      }
    </script>
  </body>
</html>
